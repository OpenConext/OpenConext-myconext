<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="tabs(active)" class="tabs">
    <style>
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid #ccc; margin-bottom: 16px; }
        .tabs a { padding: 8px 16px; border: 1px solid #ccc; border-bottom: none; text-decoration: none; color: #333; }
        .tabs a.active { font-weight: bold; background: #eee; }
    </style>
    <a th:href="@{/enrollments}" th:classappend="${active == 'enrollments'} ? 'active'">Enrollments</a>
    <a th:href="@{/authentications}" th:classappend="${active == 'authentications'} ? 'active'">Authentications</a>
    <a th:href="@{/registrations}" th:classappend="${active == 'registrations'} ? 'active'">Registrations</a>
</nav>
</body>
</html>
