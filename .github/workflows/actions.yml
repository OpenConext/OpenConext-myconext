# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The jars for the e2e job, without the tests of the build job that take about 20 minutes
  jars:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 21
        distribution: 'temurin'
        cache: 'maven'
    - name: Package the server and the tiqr-mock
      run: mvn -B -DskipTests -pl myconext-server,tiqr-mock -am clean package
    - name: Upload jars for the e2e tests
      uses: actions/upload-artifact@v7
      with:
        name: e2e-jars
        retention-days: 1
        path: |
          myconext-server/target/myconext-server-*.jar
          tiqr-mock/target/tiqr-mock-*.jar

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        mongodb-version: [4.4]

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24.3.0'
    - name: Get Yarn cache directory path
      id: yarn-cache-dir-path
      run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
    - name: Set up Yarn cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
    - name: Start MongoDB
      uses: supercharge/mongodb-github-action@1.12.1
      with:
        mongodb-version: ${{ matrix.mongodb-version }}
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: 21
        distribution: 'temurin'
        cache: 'maven'
    - name: Build with Maven
      run: mvn clean install --file pom.xml
    - name: Generate JaCoCo Badge
      uses: cicirello/jacoco-badge-generator@v2
      with:
        generate-branches-badge: true
        jacoco-csv-file: "**/jacoco.csv"
    - name: Log coverage percentage
      run: |
        echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
        echo "branch coverage = ${{ steps.jacoco.outputs.branches }}"


    - name: Commit the badge (if it changed)
      if: github.ref == 'refs/heads/main'
      run: |
        if [[ `git status --porcelain` ]]; then
          git config --global user.name 'Okke Harsta'
          git config --global user.email 'oharsta@users.noreply.github.com'
          git add -A
          git commit -m "Autogenerated JaCoCo coverage badge"
          git pull -r
          git push
        fi

  e2e:
    needs: jars
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
        env:
          MP_UI_AUTH: "user:password"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24.3.0'
    - uses: actions/setup-java@v6
      with:
        java-version: 21
        distribution: 'temurin'
    - name: Start MongoDB
      uses: supercharge/mongodb-github-action@1.12.1
      with:
        mongodb-version: 4.4
    - uses: actions/download-artifact@v8
      with:
        name: e2e-jars
        path: jars
    - name: Start the server (profile test authenticates as the user seeded by profile e2e, which also points oidc to the tiqr-mock) and the tiqr-mock
      run: |
        server_jar=$(find jars -name 'myconext-server-*.jar' ! -name '*.original' | head -n 1)
        tiqr_jar=$(find jars -name 'tiqr-mock-*.jar' ! -name '*.original' | head -n 1)
        # The server fetches the SAML metadata of the SP at startup, that host is not reachable from the runner
        sp_metadata="file://$GITHUB_WORKSPACE/.github/e2e/engine-test-sp-metadata.xml"
        nohup java -jar "$server_jar" --spring.profiles.active=test,e2e \
          --sp_entity_id=https://engine.test.surfconext.nl/authentication/sp/metadata \
          --account_metadata_url="$sp_metadata" > server.log 2>&1 &
        server_pid=$!
        nohup java -jar "$tiqr_jar" > tiqr-mock.log 2>&1 &
        for url in http://localhost:8081/internal/health http://localhost:8088/internal/health; do
          if ! timeout 120 bash -c "until curl -sf $url > /dev/null; do sleep 2; done"; then
            echo "::error::$url did not become healthy"
            jcmd $server_pid Thread.print > threads.txt 2>&1 || true
            tail -n 50 server.log
            tail -n 20 tiqr-mock.log
            exit 1
          fi
        done
    - name: Install my-gui
      working-directory: my-gui
      run: yarn install --frozen-lockfile
    - name: Install Playwright browsers
      working-directory: my-gui
      run: npx playwright install --with-deps chromium
    - name: Run the e2e tests
      working-directory: my-gui
      run: yarn e2e
    - name: Upload the Playwright report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        retention-days: 7
        path: |
          my-gui/playwright-report
          my-gui/test-results
          server.log
          tiqr-mock.log
          threads.txt
