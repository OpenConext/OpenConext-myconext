ServerName https://${HTTPD_SERVERNAME}

# Prevent Shibboleth attribute header spoofing: strip any of these headers if a client
# sends them directly. mod_shib repopulates them itself, from the validated session,
# only for requests it actually authenticates. This runs unconditionally for the whole
# vhost ("early", before URL translation/auth), so it also covers <Location> blocks
# below that use "Require all granted" and therefore never invoke mod_shib at all
# (e.g. /config) - without this, those paths would pass client-supplied headers
# straight through to the backend's ShibbolethPreAuthenticatedProcessingFilter, which
# trusts them to log a user in.
RequestHeader unset uid early
RequestHeader unset schacHomeOrganization early
RequestHeader unset Shib-givenName early
RequestHeader unset Shib-surName early
RequestHeader unset Shib-InetOrgPerson-mail early
RequestHeader unset is-member-of early
RequestHeader unset REMOTE_USER early
RequestHeader unset EMAIL early
RequestHeader unset CN early
RequestHeader unset shib-attribute-.* early
RequestHeader unset shib-mapped-.* early
RequestHeader unset Auth_Type early
RequestHeader unset shib-authn-context early
RequestHeader unset shib-authn-instant early
RequestHeader unset shib-authn-method early
RequestHeader unset name-id early
RequestHeader unset eduPersonEntitlement early
RequestHeader unset displayName early
RequestHeader unset Shib-commonName early
RequestHeader unset Shib-orgUnit early
RequestHeader unset Shib-eduPersonAffiliation  early
RequestHeader unset Shib-eduPersonScopedAffiliation  early
RequestHeader unset Shib-eduPersonTargetedID  early
RequestHeader unset Shib-eduPersonPN early
RequestHeader unset Shib-eduPersonOrcid early
RequestHeader unset Shib-preferredLanguage early
RequestHeader unset Shib-schacHomeOrganizationType early
RequestHeader unset Shib-schacPersonalUniqueCode early
RequestHeader unset Shib-nlEduPersonOrgUnit early
RequestHeader unset Shib-nlEduPersonStudyBranch early
RequestHeader unset Shib-nlStudielinkNummer early
RequestHeader unset Shib-surfEckid early
RequestHeader unset Shib-eduid early
RequestHeader unset Shib-surf-crm early
RequestHeader unset Shib-surf-autorisaties early
RequestHeader unset Shib-subjectid early

RewriteEngine on

RewriteCond %{REQUEST_URI} !\.html$
RewriteCond %{REQUEST_URI} !\.(js|css)(\.map)?$
RewriteCond %{REQUEST_URI} !\.svg$
RewriteCond %{REQUEST_URI} !\.webp$
RewriteCond %{REQUEST_URI} !\.jpg$
RewriteCond %{REQUEST_URI} !\.png$
RewriteCond %{REQUEST_URI} !\.ico$
RewriteCond %{REQUEST_URI} !\.woff$
RewriteCond %{REQUEST_URI} !\.woff2$
RewriteCond %{REQUEST_URI} !\.ttf$
RewriteCond %{REQUEST_URI} !\.eot$
RewriteCond %{REQUEST_URI} !^/(asset-)?manifest.json$
RewriteCond %{REQUEST_URI} !^/myconext
RewriteCond %{REQUEST_URI} !^/internal
RewriteCond %{REQUEST_URI} !^/robots.txt
RewriteCond %{REQUEST_URI} !^/config
RewriteCond %{REQUEST_URI} !^/fonts
RewriteCond %{REQUEST_URI} !^/.well-known
RewriteRule (.*) /index.html [L]

ProxyPreserveHost On
ProxyPass /Shibboleth.sso !

ProxyPass /myconext/api http://myconextserver:8080/myconext/api
ProxyPassReverse /myconext/api http://myconextserver:8080/myconext/api

ProxyPass /internal http://myconextserver:8080/internal
ProxyPass /robots.txt http://myconextserver:8080/robots.txt
ProxyPass /config http://myconextserver:8080/config

<Location />
  AuthType shibboleth
  ShibUseHeaders On
  ShibRequireSession On
  Require valid-user
</Location>

DocumentRoot "/var/www"

<Directory "/var/www">
  Require all granted
  Options     -Indexes
</Directory>

# Public endpoints
<Location ~ "/(config|404|robots.txt|login)">
  Require all granted
</Location>

<Location ~ "/internal/">
  Require all granted
</Location>

# React resources
<Location ~ "(.*)(eot|svg|webp|ttf|woff2|woff|js|js\.map|css|css\.map|png|jpg|ico)$">
  Require all granted
</Location>

<Location ~ "/.well-known/">
  Require all granted
</Location>

<Location ~ "/(asset-)?manifest.json$">
  Require all granted
</Location>

Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "same-origin"
Header always set X-Content-Type-Options "nosniff"
