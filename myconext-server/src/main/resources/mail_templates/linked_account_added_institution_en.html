<!DOCTYPE html>
<html>
<head>
    <title>{{title}}</title>
</head>
<body>
<div class="main" style="font-family: Helvetica, Arial, sans-serif;line-height: 18px;font-size: 14px;color: #353535;">
    <div class="head" style="background-color: #f5f5f5;padding: 30px 0 20px 25px;">
        <p class="title" style="font-weight: 600;font-size: 38px;line-height: 38px; margin: 0;margin-bottom: 10px">Account linked</p>
        <p class="subtitle" style="font-weight: 300;font-size: 26px;line-height: 30px; margin: 0.6em;">This address was linked to an eduID account.</p>
    </div>
    <div class="middle" style="padding: 20px 0 40px 60px;max-width: 600px;">
        <p>Hi <strong>{{name}}</strong>,</p>
        <p>Your account from <strong>{{institutionName}}</strong> has been linked to an eduID account. If this wasn't you, please contact the person who manages your institutional account.</p>
    </div>
    {{> footer_en.html}}
</div>
</body>
</html>
