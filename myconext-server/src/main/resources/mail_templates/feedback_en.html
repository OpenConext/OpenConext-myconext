<!DOCTYPE html>
<html>
<head>
    <title>{{title}}</title>
</head>
<body>
<div class="main" style="font-family: Helvetica, Arial, sans-serif;line-height: 18px;font-size: 14px;color: #353535;">
    <div class="head"
         style="background-color: #f5f5f5;border:1px solid #eaeaea;padding: 20px 0 20px 60px;font-weight: bold;font-size: 26px;border-radius: 8px;">
        <p>eduID feedback</p>
    </div>
    <div class="middle" style="padding: 20px 0 40px 60px;max-width: 600px;">
        <p>Hi,</p>
        <p><strong>{{name}}</strong> ({{email}}) has provided the following feedback{{#environment}} for the
            {{environment}} environment{{/environment}} at {{date}}:</p>
        {{#url}}
        <p>Page URL: {{url}}</p>
        {{/url}}
        <blockquote style="margin: 20px 0;padding: 10px 20px;border-left: 4px solid #eaeaea;white-space: pre-wrap;">{{message}}</blockquote>
        <p>Follow-up questions can be sent to <a href="mailto:{{email}}">{{email}}</a></p>
    </div>
    {{> footer_en.html}}
</div>
</body>
</html>
